<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create account</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0b;
      --surface: #111113;
      --border: #222226;
      --border-focus: #3a3a42;
      --border-error: rgba(255, 107, 107, 0.4);
      --text: #e8e8ea;
      --muted: #6b6b72;
      --accent: #7c6aff;
      --accent-dim: rgba(124, 106, 255, 0.12);
      --error: #ff6b6b;
      --success: #4ade80;
      --radius: 10px;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      padding: 24px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.35;
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed;
      top: -20%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(124,106,255,0.08) 0%, transparent 70%);
      pointer-events: none;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      animation: rise 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 32px;
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      background: var(--accent-dim);
      border: 1px solid rgba(124,106,255,0.3);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .brand-icon svg { width: 16px; height: 16px; stroke: var(--accent); }

    .brand-name {
      font-family: 'DM Mono', monospace;
      font-size: 13px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    h1 {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 6px;
    }

    .subtitle {
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 32px;
    }

    .row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
    }

    .field { margin-bottom: 16px; }

    label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--muted);
      letter-spacing: 0.05em;
      text-transform: uppercase;
      margin-bottom: 7px;
    }

    input {
      width: 100%;
      padding: 11px 14px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      color: var(--text);
      font-family: 'DM Sans', sans-serif;
      font-size: 14.5px;
      outline: none;
      transition: border-color 0.15s, box-shadow 0.15s;
    }

    input::placeholder { color: var(--muted); opacity: 0.5; }
    input:focus {
      border-color: var(--border-focus);
      box-shadow: 0 0 0 3px rgba(124,106,255,0.1);
    }

    input.invalid {
      border-color: var(--border-error);
      box-shadow: 0 0 0 3px rgba(255,107,107,0.08);
    }

    .field-hint {
      font-size: 11.5px;
      color: var(--error);
      margin-top: 5px;
      display: none;
    }

    .field-hint.show { display: block; }

    .btn {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      background: var(--accent);
      color: #fff;
      border: none;
      border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif;
      font-size: 14.5px;
      font-weight: 500;
      cursor: pointer;
      transition: opacity 0.15s, transform 0.1s;
    }

    .btn:hover { opacity: 0.88; }
    .btn:active { transform: scale(0.99); }
    .btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }

    .btn .spinner {
      display: none;
      width: 16px;
      height: 16px;
      border: 2px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin: 0 auto;
    }

    .btn.loading .btn-text { display: none; }
    .btn.loading .spinner { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    .alert {
      display: none;
      padding: 11px 14px;
      border-radius: var(--radius);
      font-size: 13px;
      margin-top: 14px;
      line-height: 1.4;
    }

    .alert.error {
      background: rgba(255,107,107,0.08);
      border: 1px solid rgba(255,107,107,0.2);
      color: var(--error);
    }

    .alert.success {
      background: rgba(74,222,128,0.08);
      border: 1px solid rgba(74,222,128,0.2);
      color: var(--success);
    }

    .divider {
      display: flex;
      align-items: center;
      gap: 12px;
      margin: 24px 0;
    }

    .divider::before, .divider::after {
      content: '';
      flex: 1;
      height: 1px;
      background: var(--border);
    }

    .divider span { font-size: 12px; color: var(--muted); }

    .bottom-link {
      text-align: center;
      font-size: 13.5px;
      color: var(--muted);
    }

    .bottom-link a {
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }

    .bottom-link a:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-icon">
        <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" d="M15.75 5.25a3 3 0 013 3m3 0a6 6 0 01-7.029 5.912c-.563-.097-1.159.026-1.563.43L10.5 17.25H8.25v2.25H6v2.25H2.25v-2.818c0-.597.237-1.17.659-1.591l6.499-6.499c.404-.404.527-1 .43-1.563A6 6 0 1121.75 8.25z" />
        </svg>
      </div>
      <span class="brand-name">auth.yourapp.dev</span>
    </div>

    <h1>Create account</h1>
    <p class="subtitle">Get started in seconds</p>

    <form id="signup-form" novalidate>
      <div class="row">
        <div class="field">
          <label for="first-name">First name</label>
          <input type="text" id="first-name" placeholder="John" required autocomplete="given-name" />
        </div>
        <div class="field">
          <label for="last-name">Last name</label>
          <input type="text" id="last-name" placeholder="Doe" autocomplete="family-name" />
        </div>
      </div>

      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="you@example.com" required autocomplete="email" />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Min. 8 characters" required autocomplete="new-password" />
        <span class="field-hint" id="pw-hint">Must include an uppercase letter and a number</span>
      </div>

      <div class="field">
        <label for="confirm-password">Confirm password</label>
        <input type="password" id="confirm-password" placeholder="Re-enter password" required autocomplete="new-password" />
        <span class="field-hint" id="confirm-hint">Passwords do not match</span>
      </div>

      <button type="submit" class="btn" id="submit-btn">
        <span class="btn-text">Create account</span>
        <span class="spinner"></span>
      </button>

      <div class="alert error" id="error-msg"></div>
      <div class="alert success" id="success-msg"></div>
    </form>

    <div class="divider"><span>have an account?</span></div>

    <p class="bottom-link">
      <a href="/login.html">Sign in instead</a>
    </p>
  </div>

  <script>
    const pwInput = document.getElementById("password");
    const confirmInput = document.getElementById("confirm-password");
    const pwHint = document.getElementById("pw-hint");
    const confirmHint = document.getElementById("confirm-hint");

    const passwordRegex = /^(?=.*[A-Z])(?=.*\d).{8,}$/;

    pwInput.addEventListener("blur", () => {
      // ← fix: was `password` (undefined), now correctly uses pwInput.value
      if (pwInput.value && !passwordRegex.test(pwInput.value)) {
        pwInput.classList.add("invalid");
        pwHint.classList.add("show");
      } else {
        pwInput.classList.remove("invalid");
        pwHint.classList.remove("show");
      }
    });

    confirmInput.addEventListener("blur", validateConfirm);
    confirmInput.addEventListener("input", () => {
      if (confirmInput.classList.contains("invalid")) validateConfirm();
    });

    function validateConfirm() {
      if (confirmInput.value && confirmInput.value !== pwInput.value) {
        confirmInput.classList.add("invalid");
        confirmHint.classList.add("show");
      } else {
        confirmInput.classList.remove("invalid");
        confirmHint.classList.remove("show");
      }
    }

    document.getElementById("signup-form").addEventListener("submit", async (e) => {
      e.preventDefault();

      const btn = document.getElementById("submit-btn");
      const errorEl = document.getElementById("error-msg");
      const successEl = document.getElementById("success-msg");
      const password = pwInput.value;
      const confirm = confirmInput.value;

      if (!passwordRegex.test(password)) {
        pwInput.classList.add("invalid");
        pwHint.classList.add("show");
        pwInput.focus();
        return;
      }

      if (password !== confirm) {
        confirmInput.classList.add("invalid");
        confirmHint.classList.add("show");
        confirmInput.focus();
        return;
      }

      btn.classList.add("loading");
      btn.disabled = true;
      errorEl.style.display = "none";
      successEl.style.display = "none";

      try {
        const res = await fetch("/api/auth/register", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            firstName: document.getElementById("first-name").value,
            lastName: document.getElementById("last-name").value || undefined,
            email: document.getElementById("email").value,
            password,
          }),
        });

        const data = await res.json();

        if (!res.ok) {
          errorEl.textContent = data.message ?? data.error ?? "Registration failed.";
          errorEl.style.display = "block";
          return;
        }

        successEl.textContent = "Account created! Redirecting to sign in...";
        successEl.style.display = "block";

        setTimeout(() => {
          window.location.href = "/login.html" + window.location.search;
        }, 1500);
      } catch {
        errorEl.textContent = "Something went wrong. Please try again.";
        errorEl.style.display = "block";
      } finally {
        btn.classList.remove("loading");
        btn.disabled = false;
      }
    });
  </script>
</body>
</html>
