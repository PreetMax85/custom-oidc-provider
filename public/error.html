<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Something went wrong</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0a0b;
      --surface: #111113;
      --border: #222226;
      --text: #e8e8ea;
      --muted: #6b6b72;
      --accent: #7c6aff;
      --error: #ff6b6b;
      --radius: 10px;
    }

    body {
      min-height: 100dvh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg);
      font-family: 'DM Sans', sans-serif;
      color: var(--text);
      padding: 24px;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background-image:
        linear-gradient(var(--border) 1px, transparent 1px),
        linear-gradient(90deg, var(--border) 1px, transparent 1px);
      background-size: 48px 48px;
      opacity: 0.35;
      pointer-events: none;
    }

    .card {
      position: relative;
      width: 100%;
      max-width: 400px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 40px;
      text-align: center;
      animation: rise 0.4s cubic-bezier(0.16, 1, 0.3, 1) both;
    }

    @keyframes rise {
      from { opacity: 0; transform: translateY(16px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .icon {
      width: 48px;
      height: 48px;
      background: rgba(255,107,107,0.1);
      border: 1px solid rgba(255,107,107,0.2);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
    }

    .icon svg { width: 22px; height: 22px; stroke: var(--error); }

    h1 {
      font-size: 20px;
      font-weight: 500;
      letter-spacing: -0.02em;
      margin-bottom: 8px;
    }

    .desc {
      font-size: 13.5px;
      color: var(--muted);
      margin-bottom: 12px;
      line-height: 1.5;
    }

    .code {
      display: inline-block;
      font-family: 'DM Mono', monospace;
      font-size: 12px;
      color: var(--error);
      background: rgba(255,107,107,0.08);
      border: 1px solid rgba(255,107,107,0.15);
      padding: 4px 10px;
      border-radius: 6px;
      margin-bottom: 28px;
    }

    .btn {
      display: inline-block;
      padding: 10px 24px;
      background: transparent;
      color: var(--text);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      font-family: 'DM Sans', sans-serif;
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      text-decoration: none;
      transition: border-color 0.15s, color 0.15s;
    }

    .btn:hover {
      border-color: var(--border-focus, #3a3a42);
      color: var(--text);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">
      <svg fill="none" viewBox="0 0 24 24" stroke-width="2" stroke="currentColor">
        <path stroke-linecap="round" stroke-linejoin="round" d="M12 9v3.75m-9.303 3.376c-.866 1.5.217 3.374 1.948 3.374h14.71c1.73 0 2.813-1.874 1.948-3.374L13.949 3.378c-.866-1.5-3.032-1.5-3.898 0L2.697 16.126zM12 15.75h.007v.008H12v-.008z" />
      </svg>
    </div>

    <h1>Something went wrong</h1>
    <p class="desc" id="error-desc">An error occurred during authentication.</p>
    <div class="code" id="error-code">unknown_error</div>
    <br />
    <a href="javascript:history.back()" class="btn">Go back</a>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");
    const desc = params.get("error_description");

    if (error) document.getElementById("error-code").textContent = error;
    if (desc) document.getElementById("error-desc").textContent = desc;

    const messages = {
      invalid_client: "The application that sent you here is not recognized.",
      invalid_request: "The authorization request was malformed.",
      access_denied: "You denied access to this application.",
      unsupported_response_type: "This authorization flow is not supported.",
    };

    if (error && messages[error]) {
      document.getElementById("error-desc").textContent = messages[error];
    }
  </script>
</body>
</html>
